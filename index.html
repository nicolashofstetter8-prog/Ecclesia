  --lit-g:#4d7c5a; --lit-v:#5b3f8c; --lit-w:#e6dbc2; --lit-r:#a6442e; --lit-rose:#cf86a2;
  --grp-youth:#a6442e; --grp-young:#3f6fa3; --grp-adult:#4d7c5a;
  --shadow:0 1px 2px rgba(31,42,68,.04),0 6px 20px -12px rgba(31,42,68,.14);
  --serif:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Outfit",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --nav-h:66px; --r:16px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#141a2a; --surface:#1d2540; --surface-2:#232c4a; --text:#ece4d6; --muted:#a3a7b5; --line:rgba(236,228,214,.13);
    --gold:#d2a95a; --gold-ink:#e2c287; --gold-soft:rgba(210,169,90,.16); --on-gold:#1a1408;
    --head:#1d2540; --head-text:#ece4d6; --head-chip:rgba(255,255,255,.09);
    --rust:#d9775f; --blue:#7fa6d4; --ok:#6fb487;
    --lit-g:#6da57c; --lit-v:#9b7fd0; --lit-w:#d9cdb0; --lit-r:#d9775f; --lit-rose:#e4a3bb;
    --grp-youth:#d9775f; --grp-young:#7fa6d4; --grp-adult:#6da57c;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#141a2a; --surface:#1d2540; --surface-2:#232c4a; --text:#ece4d6; --muted:#a3a7b5; --line:rgba(236,228,214,.13);
  --gold:#d2a95a; --gold-ink:#e2c287; --gold-soft:rgba(210,169,90,.16); --on-gold:#1a1408;
  --head:#1d2540; --head-text:#ece4d6; --head-chip:rgba(255,255,255,.09);
  --rust:#d9775f; --blue:#7fa6d4; --ok:#6fb487;
  --lit-g:#6da57c; --lit-v:#9b7fd0; --lit-w:#d9cdb0; --lit-r:#d9775f; --lit-rose:#e4a3bb;
  --grp-youth:#d9775f; --grp-young:#7fa6d4; --grp-adult:#6da57c;
  --shadow:none;
}
html{font-size:16px;-webkit-text-size-adjust:100%}
html.big{font-size:18.5px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font:400 1rem/1.5 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.serif{font-family:var(--serif)}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.005em}
h2{font-size:1.75rem;line-height:1.15}
h3{font-size:1.3rem;line-height:1.2}
p{margin:0}
a{color:var(--blue)}
.muted{color:var(--muted)}
.small{font-size:.8125rem}
.tiny{font-size:.75rem}
.eyebrow{font-family:var(--serif);font-size:.85rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-ink);font-weight:600}
.stack{display:grid;gap:12px}
.stack-lg{display:grid;gap:20px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grow{flex:1;min-width:0}
[hidden]{display:none!important}

/* Kopfbereich */
.head{position:sticky;top:0;z-index:20;background:var(--head);color:var(--head-text);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px}
.head-in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--serif);font-size:1.6rem;font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:8px;background:none;border:0;color:inherit;padding:0}
.brand svg{width:20px;height:20px;color:var(--gold)}
.head select{background:var(--head-chip);color:var(--head-text);border:0;border-radius:10px;padding:7px 10px;font-size:.85rem;max-width:180px}
.head select option{color:#1f2a44}

main{max-width:640px;margin:0 auto;padding:18px 16px calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 28px)}
.view{display:grid;gap:16px}
.view.enter{animation:rise .28s ease-out}
@keyframes rise{from{opacity:.55;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view.enter{animation:none}*{transition:none!important}}

/* Karten */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card.gold{background:var(--gold-soft);border-color:rgba(184,137,59,.3)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;color:inherit}
.li:first-child{border-top:0}
button.li:hover{background:var(--surface-2)}
.li .t{font-weight:500;line-height:1.3}
.li .s{font-size:.8rem;color:var(--muted);margin-top:2px}
.datebox{width:46px;text-align:center;line-height:1.05;font-variant-numeric:tabular-nums}
.datebox b{display:block;font-family:var(--serif);font-size:1.45rem;font-weight:700}
.datebox span{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* Chips & Buttons */
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:6px 12px;font-size:.8rem;font-weight:500;line-height:1.2;transition:background .15s,color .15s,transform .1s}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--c,var(--ink));border-color:var(--c,var(--ink));color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]:not([style]){background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:4px 10px;font-size:.75rem;font-weight:500;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.pill.solid{background:var(--c);border-color:var(--c);color:#fff}
.pill.light{color:#3b3222}
.rank{display:inline-block;font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--gold-soft);color:var(--gold-ink)}
.rank.hol{background:rgba(166,68,46,.12);color:var(--rust)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 16px;font-weight:600;background:var(--gold);color:var(--on-gold);font-size:.95rem}
.btn.full{width:100%}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.ink{background:var(--ink);color:#fbf7f0}
:root[data-theme="dark"] .btn.ink{background:var(--surface-2)}
.btn.small{padding:7px 12px;font-size:.82rem;border-radius:10px}
.btn.danger{background:transparent;color:var(--rust);border:1px solid var(--line)}
.iconbtn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:1.1rem}
.seg{display:flex;gap:4px;padding:4px;background:var(--surface-2);border-radius:13px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:8px 6px;font-size:.8rem;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

/* Formulare */
.field{display:grid;gap:5px;font-size:.82rem;font-weight:500;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:11px;padding:10px 12px;font-size:1rem;font-weight:400}
textarea.inp{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1.3fr .8fr .9fr;gap:10px}
@media (max-width:380px){.grid2,.grid3{grid-template-columns:1fr}}

/* Kalender */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cal-title{border:0;background:none;padding:0;text-align:left;color:inherit}
.cal-title h2{font-size:1.9rem}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dow{text-align:center;font-size:.68rem;font-weight:600;letter-spacing:.08em;color:var(--muted);padding-bottom:2px}
.cell{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;color:var(--text);font-variant-numeric:tabular-nums;transition:transform .1s}
.cell:active{transform:scale(.95)}
.cell .n{font-size:.92rem;font-weight:500;line-height:1}
.cell.sun .n{font-weight:700}
.cell .lit{position:absolute;left:22%;right:22%;bottom:5px;height:3px;border-radius:2px;background:var(--c)}
.cell.lit-w .lit{box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.cell .dots{display:flex;gap:2px;height:5px}
.cell .dots i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.cell .star{position:absolute;top:3px;right:5px;font-size:.6rem;color:var(--gold)}
.cell .hd{position:absolute;top:4px;left:5px;width:6px;height:6px;border-radius:50%;background:var(--rust)}
.cell .hd.part{background:transparent;box-shadow:inset 0 0 0 1.5px var(--rust)}
.cell.sol{border:1.5px solid var(--gold)}
.cell.today{box-shadow:0 0 0 2px var(--gold) inset}
.cell.sel{background:var(--gold);color:#fff;border-color:var(--gold)}
:root[data-theme="dark"] .cell.sel{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cell.sel{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}}
.cell.out{visibility:hidden}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.75rem;color:var(--muted)}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);vertical-align:-1px;margin-right:5px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}

/* Tageskarte mit Stola */
.stole-card{display:grid;grid-template-columns:12px 1fr;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.stole{background:var(--c)}
.stole-body{padding:18px 18px 18px 16px;display:grid;gap:10px}
.cel-name{font-family:var(--serif);font-size:1.65rem;line-height:1.15;font-weight:600}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.fact{border-top:1px solid var(--line);padding-top:7px}
.fact b{display:block;font-size:1.02rem;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fact span{font-size:.7rem;color:var(--muted)}
@media (max-width:400px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.memo{border-left:3px solid var(--c);padding:2px 0 2px 10px}
.hol{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:rgba(166,68,46,.08);border:1px solid rgba(166,68,46,.22)}
.hol b{color:var(--rust)}

/* Termine */
.ev{display:grid;grid-template-columns:4px 1fr;gap:12px}
.ev .bar{border-radius:4px;background:var(--c)}
.banner{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:rgba(166,68,46,.1);color:var(--rust);font-size:.85rem;font-weight:500}

/* Gebet */
.acc{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.acc>button{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;border:0;background:none;padding:14px;text-align:left;color:inherit}
.acc>button .chev{transition:transform .2s;color:var(--muted)}
.acc[open-state="1"]>button .chev{transform:rotate(90deg)}
.acc .body{padding:0 14px 14px;line-height:1.65;font-size:.95rem}
.prayer{font-family:var(--serif);font-size:1.18rem;line-height:1.55;white-space:pre-line}
.now{outline:2px solid var(--gold);outline-offset:-2px}
.breath{width:150px;height:150px;border-radius:50%;margin:8px auto;background:radial-gradient(circle,var(--gold-soft) 0,var(--gold-soft) 55%,transparent 56%);display:grid;place-items:center;border:2px solid var(--gold);transform:scale(.72);transition:transform 4s ease-in-out}
.breath.in{transform:scale(1)}
.breath span{font-family:var(--serif);font-size:1.15rem;text-align:center;padding:0 10px}
.timer{font-variant-numeric:tabular-nums;font-size:1.6rem;font-family:var(--serif);text-align:center}

/* Gemeinde */
.msg{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.msg.mine{background:var(--gold-soft);border-color:rgba(184,137,59,.28)}
.compose{display:flex;gap:8px}
.compose .inp{border-radius:22px}
.compose .btn{border-radius:22px}
#map{height:260px;border-radius:14px;border:1px solid var(--line);overflow:hidden;z-index:0}
.candle{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--gold-soft);color:var(--gold-ink);border-radius:999px;padding:6px 12px;font-weight:600;font-variant-numeric:tabular-nums}
.flame{width:10px;height:16px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 50% 70%,#fff3c4,#f2b33d 55%,#d9772b);display:inline-block;transform-origin:50% 100%}
.candle.lit .flame{animation:flick 1.2s ease-in-out infinite alternate}
@keyframes flick{from{transform:scaleY(1) rotate(-2deg)}to{transform:scaleY(1.15) rotate(2deg)}}
.donate-hero{border-radius:18px;padding:18px;color:#fff;background:linear-gradient(135deg,#b8893b 0%,#8a6829 100%)}
.qrbill{background:#fff;color:#000;border-radius:10px;border:1px solid var(--line);padding:16px;display:grid;grid-template-columns:auto 1fr;gap:16px;font-family:Helvetica,Arial,sans-serif}
.qrbill h4{margin:0 0 8px;font-size:15px}
.qrbill .h{font-size:9px;font-weight:700;margin-top:6px}
.qrbill .v{font-size:11px;line-height:1.35;white-space:pre-line;word-break:break-word}
.qrbill canvas{width:46mm;max-width:170px;height:auto;aspect-ratio:1/1;image-rendering:pixelated;display:block}
@media (max-width:400px){.qrbill{grid-template-columns:1fr}}

/* Navigation */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);height:var(--nav-h)}
.nav button{border:0;background:none;display:grid;place-items:center;align-content:center;gap:3px;font-size:.66rem;font-weight:500;color:var(--muted);transition:color .2s,transform .2s}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--gold);transform:translateY(-1px);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);background:var(--ink);color:#fbf7f0;padding:10px 16px;border-radius:12px;font-size:.88rem;z-index:50;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
:root[data-theme="dark"] .toast{background:var(--gold);color:var(--on-gold)}
.sheet-bg{position:fixed;inset:0;background:rgba(15,20,35,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;max-height:85vh;overflow:auto}
.scroll-x{overflow-x:auto}
table.mx{border-collapse:collapse;font-size:.75rem;min-width:100%}
table.mx th,table.mx td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;white-space:nowrap}
table.mx td.c{text-align:center}
.st-G{color:var(--rust);font-weight:700}
.st-T,.st-H{color:var(--muted)}

/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;

<script>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

  /* ---------- Temporale (Herrenjahr) ---------- */
  function temporal(date, A) {
    var dow = date.getDay(), t = { prec: 13, name: '', color: 'g', rank: '', season: 'ordinary', week: 0, psalter: '' };
    var Wd = WD[dow];

      cands.push({ name: t.name, rank: t.rank, color: t.color, prec: t.prec, temporal: true });
      day.solemnities.forEach(function (s) { cands.push(s); });
      day.feasts.forEach(function (f) { cands.push(f); });
      cands.sort(function (a, b) { return a.prec - b.prec || (a.temporal ? -1 : 1); });

          mem.forEach(function (m) { extra.push({ name: m.name, color: m.color, label: 'nichtgebotener Gedenktag' }); });
          opt.forEach(function (o) { extra.push({ name: o.name, color: o.color, label: 'nichtgebotener Gedenktag' }); });
        } else if (mem.length) {
          win = mem[0];
          mem.slice(1).forEach(function (m) { extra.push({ name: m.name, color: m.color, label: 'Gedenktag' }); });
        } else {
          opt.forEach(function (o) { extra.push({ name: o.name, color: o.color, label: 'nichtgebotener Gedenktag' }); });
        }
      } else if (win.prec === 9 && win.temporal) {

      }

      }

      });

    });

    return yearCache[y];
  }

  function day(date) {

    var reg = (S.regional[md(date)] || []).map(function (r) { return { name: r.name, where: r.where, color: r.color }; });
    var weekLabel = t.week ? weekText(t) : '';

  /* ---------- Swiss QR-Rechnung ---------- */
  function ibanValid(iban) {
    var s = iban.replace(/\s/g, '').toUpperCase();

    var r = s.slice(4) + s.slice(0, 4), n = '';

  }
  function isQrIban(iban) { var iid = Number(iban.replace(/\s/g, '').slice(4, 9)); return iid >= 30000 && iid <= 31999; }

  }

    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (qr.isDark(r, c)) g.fillRect(c * sc, r * sc, sc, sc);
    var cs = size * 7 / 46, x = (size - cs) / 2, b = cs * 0.09, cx = size / 2, arm = cs * 0.19, len = cs * 0.6;
    g.fillStyle = '#fff'; g.fillRect(x - b, x - b, cs + 2 * b, cs + 2 * b);
    g.fillStyle = '#000'; g.fillRect(x, x, cs, cs);
    g.fillStyle = '#fff'; g.fillRect(cx - arm / 2, cx - len / 2, arm, len); g.fillRect(cx - len / 2, cx - arm / 2, len, arm);
  }

  /* =========================================================
     Export (.ics / .json)
     ========================================================= */
  function download(name, mime, text) {
    try {
      var blob = new Blob([text], { type: mime }), a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      toast(name + ' gespeichert');
    } catch (e) { toast('Speichern ist hier nicht möglich.'); }
  }
  function icsDate(d) { return d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2); }
  function icsEsc(s) { return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n'); }
  function exportIcs(y) {
    var c = state.settings.canton, lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Ecclesia//Liturgischer Kalender//DE', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:Ecclesia ' + y];
    var stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
    function allDay(d, title, desc, id) { lines.push('BEGIN:VEVENT', 'UID:' + id + '@ecclesia', 'DTSTAMP:' + stamp, 'DTSTART;VALUE=DATE:' + icsDate(d), 'DTEND;VALUE=DATE:' + icsDate(L.add(d, 1)), 'SUMMARY:' + icsEsc(title), 'DESCRIPTION:' + icsEsc(desc), 'TRANSP:TRANSPARENT', 'END:VEVENT'); }
    L.majorsOfYear(y).forEach(function (x) { allDay(x.date, '✦ ' + x.celebration.name, x.celebration.rank + ' · ' + x.seasonName, 'lit-' + x.key); });
    var hm = L.holidaysOfYear(y);
    Object.keys(hm).forEach(function (k) { hm[k].forEach(function (h) { if (h.cantons[c] === 'G' && h.id !== 'bettag') allDay(h.date, 'Feiertag: ' + h.name, 'Gesetzlicher Feiertag im Kanton ' + cantonName(c), 'hol-' + h.id + '-' + k); }); });
    state.events.forEach(function (e) {
      if (e.date.slice(0, 4) !== String(y)) return;
      var d = L.fromKey(e.date), t = (e.time || '').replace(':', '');
      lines.push('BEGIN:VEVENT', 'UID:ev-' + e.id + '@ecclesia', 'DTSTAMP:' + stamp);
      if (/^\d{4}$/.test(t)) { lines.push('DTSTART;TZID=Europe/Zurich:' + icsDate(d) + 'T' + t + '00', 'DURATION:PT2H'); } else lines.push('DTSTART;VALUE=DATE:' + icsDate(d));
      lines.push('SUMMARY:' + icsEsc(e.title), 'LOCATION:' + icsEsc(e.place || cantonName(e.canton)), 'DESCRIPTION:' + icsEsc(grp(e.group).label + (e.deadline ? ' · Anmeldeschluss ' + fmt(L.fromKey(e.deadline)) : '')));
      if (e.deadline) { var dd = L.diff(L.fromKey(e.deadline), d); lines.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc('Anmeldeschluss: ' + e.title), 'TRIGGER:-P' + Math.max(dd + 1, 1) + 'D', 'END:VALARM'); }
      lines.push('END:VEVENT');
    });
    lines.push('END:VCALENDAR');
    download('Ecclesia-' + y + '-' + c + '.ics', 'text/calendar', lines.join('\r\n'));
  }

    document.body.innerHTML =
      '<header class="head"><div class="head-in"><button class="brand" data-act="home" aria-label="Ecclesia – zum heutigen Tag">' + I.cross + 'Ecclesia</button>' +
      '<select id="head-canton" data-set="canton" aria-label="Kanton">' + CANTONS.map(function (c) { return '<option value="' + c[0] + '">' + c[1] + '</option>'; }).join('') + '</select></div></header>' +
      '<main id="main"></main>' +
      '<nav class="nav" aria-label="Hauptnavigation"><div class="nav-in">' + NAV.map(function (n) { return '<button data-act="tab" data-v="' + n[0] + '">' + n[2] + '<span>' + n[1] + '</span></button>'; }).join('') + '</div></nav>';

  function render(keepScroll) {
    var y = window.scrollY;

  function go(tab) { ui.tab = tab; try { sessionStorage.setItem('ecclesia.tab', tab); } catch (e) { } stopMed(); render(); window.scrollTo(0, 0); }

  function pickMonth() {
    var bg = document.createElement('div'); bg.className = 'sheet-bg';
    bg.innerHTML = '<div class="sheet" role="dialog" aria-label="Monat wählen"><h3>Monat und Jahr</h3><div class="grid2"><label class="field" for="pm-m">Monat<select class="inp" id="pm-m">' + MONTHS.map(function (m, i) { return '<option value="' + i + '"' + (i === ui.month ? ' selected' : '') + '>' + m + '</option>'; }).join('') + '</select></label>' +
      '<label class="field" for="pm-y">Jahr<input class="inp" id="pm-y" type="number" min="1583" max="4099" value="' + ui.year + '"></label></div><div class="grid2"><button class="btn ghost" data-pm="today">Heute</button><button class="btn" data-pm="ok">Anzeigen</button></div></div>';

  document.addEventListener('click', function (e) {
    var a = e.target.closest('[data-act]'); if (!a) return;
    var act = a.dataset.act, v = a.dataset.v;
    switch (act) {
      case 'tab': go(v); break;
      case 'home': ui.sel = today(); ui.month = ui.sel.getMonth(); ui.year = ui.sel.getFullYear(); go('daily'); break;
      case 'mon': var m = ui.month + Number(a.dataset.d), yy = ui.year; if (m < 0) { m = 11; yy--; } if (m > 11) { m = 0; yy++; } if (yy < 1583 || yy > 4099) return; ui.month = m; ui.year = yy; ui.sel = L.D(yy, m + 1, 1); if (L.same(L.D(yy, m + 1, 1), L.D(today().getFullYear(), today().getMonth() + 1, 1))) ui.sel = today(); render(); break;
      case 'yr': var ny = ui.year + Number(a.dataset.d); if (ny < 1583 || ny > 4099) return; ui.year = ny; render(); break;
      case 'pick-month': pickMonth(); break;
      case 'calmode': ui.calMode = v; render(); break;
      case 'yf': ui.yearFilter = v; render(true); break;
      case 'sel': ui.sel = L.fromKey(a.dataset.k); render(true); var det = $('article.card[aria-live]'); if (det && det.getBoundingClientRect().top > window.innerHeight - 120) det.scrollIntoView({ behavior: 'smooth', block: 'start' }); break;
      case 'goto': var d = L.fromKey(a.dataset.k); ui.sel = d; ui.month = d.getMonth(); ui.year = d.getFullYear(); ui.calMode = 'month'; go('calendar'); setTimeout(function () { var dt = $('article.card[aria-live]'); if (dt) dt.scrollIntoView({ block: 'start' }); }, 30); break;
      case 'grp': var gs = state.settings.groups, i = gs.indexOf(a.dataset.id); if (i >= 0) gs.splice(i, 1); else gs.push(a.dataset.id); save(); render(true); break;
      case 'rsvp': var r = state.rsvps, j = r.indexOf(a.dataset.id); if (j >= 0) r.splice(j, 1); else { r.push(a.dataset.id); toast('Angemeldet'); } save(); render(true); break;
      case 'acc': ui.open[a.dataset.id] = !ui.open[a.dataset.id]; render(true); break;
      case 'ptab': stopMed(); ui.prayerTab = v; render(true); break;
      case 'ctab': ui.commTab = v; render(true); break;
      case 'fmode': ui.forumMode = v; render(true); break;
      case 'atab': ui.adminTab = v; render(true); break;
      case 'allc': state.settings.allCantons = !state.settings.allCantons; save(); render(true); break;
      case 'candle': var it = state.intentions.filter(function (x) { return x.id === a.dataset.id; })[0]; if (!it) return; if (state.lit.indexOf(it.id) < 0) { state.lit.push(it.id); it.candles++; toast('Kerze entzündet'); } save(); render(true); break;
      case 'amt': ui.amount = Number(v); render(true); if (ui.amount === 0) { var f = $('#don-amt'); if (f) f.focus(); } break;
      case 'copy-qr': if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ui.payload || '').then(function () { toast('QR-Inhalt kopiert'); }, function () { toast('Kopieren nicht möglich'); }); else toast('Kopieren nicht möglich'); break;
      case 'med-start': if (medTimer) { stopMed(); medLeft = 0; render(true); } else { startMed(); a.textContent = 'Beenden'; } break;
      case 'del-ev': state.events = state.events.filter(function (x) { return x.id !== a.dataset.id; }); save(); toast('Termin gelöscht'); render(true); break;
      case 'del-pa': state.parishes = state.parishes.filter(function (x) { return x.id !== a.dataset.id; }); save(); toast('Pfarrei gelöscht'); render(true); break;

    }
  });

  document.addEventListener('submit', function (e) {
    var f = e.target.closest('[data-form]'); if (!f) return;
    e.preventDefault();
    var kind = f.dataset.form;
    if (kind === 'msg') {
      var txt = $('#msg-text').value.trim(); if (!txt) return;
      var msg = { id: uid(), name: state.userName || 'Du', ts: Date.now(), text: txt, mine: true };
      (ui.forumMode === 'forum' ? state.forum : state.adminMsgs).push(msg); save(); render(true);
      toast(ui.forumMode === 'forum' ? 'Nachricht veröffentlicht' : 'Nachricht an die Admins gesendet');
    } else if (kind === 'intent') {
      var t = $('#int-text').value.trim(); if (!t) return;
      var it = { id: uid(), text: t, candles: 1 }; state.intentions.unshift(it); state.lit.push(it.id); save(); render(true); toast('Anliegen geteilt');
    } else if (kind === 'login') {
      if ($('#adm-pin').value === String(state.adminPin || '1234')) { ui.admin = true; try { sessionStorage.setItem('ecclesia.admin', '1'); } catch (x) { } toast('Angemeldet'); render(); }
      else { toast('PIN falsch. Bitte erneut versuchen.'); $('#adm-pin').value = ''; }
    } else if (kind === 'pin') {
      var np = $('#new-pin').value.trim(); if (!/^\d{4,12}$/.test(np)) { toast('Die PIN braucht 4 bis 12 Ziffern.'); return; }
      state.adminPin = np; save(); $('#new-pin').value = ''; toast('PIN geändert');
    } else if (kind === 'donate') {
      showBill();
    } else if (kind === 'event') {
      var title = $('#ev-title').value.trim(), date = $('#ev-date').value;
      if (!title || !date) { toast('Bitte Titel und Datum angeben.'); return; }
      var dl = $('#ev-deadline').value;
      if (dl && dl > date) { toast('Der Anmeldeschluss muss vor dem Termin liegen.'); return; }
      state.events.push({ id: uid(), title: title, date: date, time: $('#ev-time').value, canton: $('#ev-canton').value, group: $('#ev-group').value, deadline: dl, place: $('#ev-place').value.trim(), rsvp: 0 });
      save(); toast('Termin hinzugefügt'); render(true);
    } else if (kind === 'parish') {
      var lat = Number(($('#pa-lat').value || '').replace(',', '.')), lon = Number(($('#pa-lon').value || '').replace(',', '.'));
      if (!(lat > 45.7 && lat < 47.9 && lon > 5.9 && lon < 10.6)) { toast('Bitte gültige Koordinaten in der Schweiz eingeben (z. B. 47.39 / 8.62).'); return; }
      state.parishes.push({ id: uid(), name: $('#pa-name').value.trim(), town: $('#pa-town').value.trim(), canton: $('#pa-canton').value, lat: lat, lon: lon, masses: $('#pa-masses').value.trim() || 'Zeiten folgen' });
      save(); toast('Pfarrei gespeichert'); render(true);
    } else if (kind === 'donation') {
      var iban = $('#dn-iban').value.replace(/\s/g, '').toUpperCase();
      if (!ibanValid(iban)) { toast('Diese IBAN ist ungültig. Bitte prüfen.'); return; }
      if (isQrIban(iban)) { toast('Das ist eine QR-IBAN. Für Spenden ohne Referenz bitte die normale IBAN verwenden.'); return; }
      state.donation = { name: $('#dn-name').value.trim(), street: $('#dn-street').value.trim(), nr: $('#dn-nr').value.trim(), zip: $('#dn-zip').value.trim(), town: $('#dn-town').value.trim(), iban: iban, test: iban === 'CH5604835012345678009' };
      save(); toast('Spendenkonto gespeichert');
    }
  });

  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.dataset && el.dataset.set) {
      if (el.dataset.set === 'canton') state.settings.canton = el.value; else state[el.dataset.set] = el.value.trim();
      save(); render(true);
    }
    if (el.id === 'imp' && el.files && el.files[0]) {
      var r = new FileReader();
      r.onload = function () {
        try { var data = JSON.parse(r.result); if (!data || !data.settings || !Array.isArray(data.events)) throw 0; state = data; save(); applySettings(); toast('Sicherung importiert'); render(); }
        catch (x) { toast('Diese Datei ist keine gültige Ecclesia-Sicherung.'); }
      };
      r.readAsText(el.files[0]);
    }
  });
  document.addEventListener('input', function (e) {
    var k = e.target.dataset && e.target.dataset.note;
    if (k) { var v = e.target.value; if (v) state.notes[k] = v; else delete state.notes[k]; save(); }
  });
  window.addEventListener('hashchange', function () { var h = location.hash.replace('#', ''); if (VIEWS[h]) go(h); });

  /* Start */
  if (ui.amount === undefined) ui.amount = 20;
  applySettings(); shell(); render();
  if (!FRAMED && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () { });
})();

</script>
</body>
</html>
